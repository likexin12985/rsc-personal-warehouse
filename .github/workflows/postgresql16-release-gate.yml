name: PostgreSQL 16 release gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      - "cloud_oam/alembic.ini"
      - "cloud_oam/backend/alembic/**"
      - "cloud_oam/backend/app/**"
      - "cloud_oam/backend/requirements.txt"
      - "cloud_oam/backend/tests/**"
      - "cloud_oam/edge_sync/**"
      - "cloud_oam/docker-compose.yml"
      - "cloud_oam/deployment/docker-compose.edge.yml"
      - "cloud_oam/deployment/postgres-init/**"
      - "cloud_oam/deployment/create_oam_edge_staging.sql"
      - "cloud_oam/deployment/provision_edge_receiver_role.sql"
      - "cloud_oam/deployment/provision_oam_work_order_source.sql"
      - "cloud_oam/deployment/redact_legacy_oam_work_order_details.sql"
      - "cloud_oam/deployment/verify_oam_edge_staging.sql"
  push:
    branches:
      - main
      - codex/production-readiness-gates
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      - "cloud_oam/alembic.ini"
      - "cloud_oam/backend/alembic/**"
      - "cloud_oam/backend/app/**"
      - "cloud_oam/backend/requirements.txt"
      - "cloud_oam/backend/tests/**"
      - "cloud_oam/edge_sync/**"
      - "cloud_oam/docker-compose.yml"
      - "cloud_oam/deployment/docker-compose.edge.yml"
      - "cloud_oam/deployment/postgres-init/**"
      - "cloud_oam/deployment/create_oam_edge_staging.sql"
      - "cloud_oam/deployment/provision_edge_receiver_role.sql"
      - "cloud_oam/deployment/provision_oam_work_order_source.sql"
      - "cloud_oam/deployment/redact_legacy_oam_work_order_details.sql"
      - "cloud_oam/deployment/verify_oam_edge_staging.sql"

permissions:
  contents: read

concurrency:
  group: postgresql16-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql16-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: rsc_pg16_release_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsc_pg16_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSC_PG16_GATE_ACKNOWLEDGE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_EPHEMERAL
      RSC_PG16_GATE_HOST: 127.0.0.1
      RSC_PG16_GATE_PORT: "5432"
      RSC_PG16_GATE_DATABASE: rsc_pg16_release_gate
      RSC_PG16_GATE_ADMIN_USER: postgres
      RSC_PG16_GATE_ADMIN_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_MIGRATOR_PASSWORD: pg16-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_API_PASSWORD: pg16-api-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_BACKUP_PASSWORD: pg16-backup-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_PROJECTOR_PASSWORD: pg16-projector-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_EDGE_RECEIVER_PASSWORD: pg16-edge-receiver-${{ github.run_id }}-${{ github.run_attempt }}-disposable-release-gate
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install pinned backend dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r cloud_oam/backend/requirements.txt pytest==9.1.1

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          psql --version | grep -E ' 16[.]'

      - name: Run projector and edge static safety gates
        working-directory: cloud_oam
        run: |
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_oam_work_order_projection.py \
            backend/tests/test_oam_projection_security.py \
            backend/tests/test_edge_database_security.py \
            backend/tests/test_edge_sync_safety.py \
            backend/tests/test_edge_sync_status.py \
            backend/tests/test_edge_runtime_env.py \
            backend/tests/test_startup_security_boundary.py \
            backend/tests/test_database_deployment_security.py \
            backend/tests/test_alembic_migrations.py \
            backend/tests/test_legacy_oam_work_order_redaction_artifact.py \
            edge_sync/test_oam_edge_sync.py

      - name: Run isolated PostgreSQL 16 migration and concurrency gate
        working-directory: cloud_oam/backend
        run: |
          python -m pytest -q tests/test_postgresql16_release_gate.py
