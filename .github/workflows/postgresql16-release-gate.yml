name: PostgreSQL 16 release gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      # Tests also read deployment files, scripts and shared backend modules.
      # Cover the whole product tree so a new release input cannot bypass CI.
      - "cloud_oam/**"
  push:
    branches:
      - main
      - codex/production-readiness-gates
      - codex/notification-delivery-worker
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      - "cloud_oam/**"

permissions:
  contents: read

concurrency:
  group: postgresql16-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg16_runtime:
    runs-on: ubuntu-24.04
    # Every leg has its own fresh database; all three are required by the
    # aggregate. Preserve each dependency chain within its selected suite.
    strategy:
      fail-fast: false
      matrix:
        suite: [migrations, inventory, control]
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: rsc_pg16_release_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsc_pg16_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSC_PG16_RUNTIME_SUITE: ${{ matrix.suite }}
      RSC_PG16_GATE_ACKNOWLEDGE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_EPHEMERAL
      RSC_PG16_GATE_HOST: 127.0.0.1
      RSC_PG16_GATE_PORT: "5432"
      RSC_PG16_GATE_DATABASE: rsc_pg16_release_gate
      RSC_PG16_GATE_ADMIN_USER: postgres
      RSC_PG16_GATE_ADMIN_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_MIGRATOR_PASSWORD: pg16-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_API_PASSWORD: pg16-api-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_BACKUP_PASSWORD: pg16-backup-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_PROJECTOR_PASSWORD: pg16-projector-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_EDGE_RECEIVER_PASSWORD: pg16-edge-receiver-${{ github.run_id }}-${{ github.run_attempt }}-disposable-release-gate
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Set up Node for mini-program API contract
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16 zsh
          psql --version | grep -E ' 16[.]'
          zsh --version

      - name: Run isolated PostgreSQL 16 migration and concurrency gate
        working-directory: cloud_oam/backend
        run: |
          python -m pytest -q tests/test_postgresql16_release_gate.py -s

  pg16_loss:
    runs-on: ubuntu-24.04
    # Each tracking mode gets a fresh service; never reuse populated runtime data.
    strategy:
      fail-fast: false
      matrix:
        tracking: [quantity, serial]
        flow: [submission, submission_http, review_seals, disposition, return_preview, return_submission, return_outbound, return_shipment, return_receipt, sender_http, sender_seals, execution_seals, correction_restore, correction_used, correction_damaged, correction_generations, correction_seal_retention, execution_http_disposition, execution_http_return, correction_request_seals, correction_http_sources, return_quality_whole, return_quality_mixed, return_stop_seals, return_stop_http, return_stop_negative, return_stop_seal_first, return_stop_execute_first, return_stop_stop_first, return_stop_outbound_first, scrap_http]
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: rsc_pg16_release_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsc_pg16_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSC_PG16_LOSS_TRACKING: ${{ matrix.tracking }}
      RSC_PG16_LOSS_FLOW: ${{ matrix.flow }}
      RSC_PG16_GATE_ACKNOWLEDGE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_EPHEMERAL
      RSC_PG16_GATE_HOST: 127.0.0.1
      RSC_PG16_GATE_PORT: "5432"
      RSC_PG16_GATE_DATABASE: rsc_pg16_release_gate
      RSC_PG16_GATE_ADMIN_USER: postgres
      RSC_PG16_GATE_ADMIN_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_MIGRATOR_PASSWORD: pg16-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_API_PASSWORD: pg16-api-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_BACKUP_PASSWORD: pg16-backup-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_PROJECTOR_PASSWORD: pg16-projector-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_EDGE_RECEIVER_PASSWORD: pg16-edge-receiver-${{ github.run_id }}-${{ github.run_attempt }}-disposable-release-gate
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Set up Node for mini-program API contract
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16 zsh
          psql --version | grep -E ' 16[.]'
          zsh --version

      - name: Run isolated PostgreSQL 16 loss ${{ matrix.flow }} gate
        working-directory: cloud_oam/backend
        run: |
          python -m pytest -q -s tests/test_postgresql16_stock_loss_release_gate.py

  pg16_condition:
    name: Business and history ${{ matrix.flow }} (${{ matrix.tracking }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        tracking: [quantity, serial]
        flow: [condition_http, legacy_history, fulfillment_http]
    env:
      OAM_MIGRATION_CACHE_EXECUTION: "1"
    steps:
      - name: Check out reviewed source and pinned predecessor history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Install PostgreSQL 16 for a newly owned private socket cluster
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16
          /usr/lib/postgresql/16/bin/postgres --version
          /usr/lib/postgresql/16/bin/initdb --version

      - name: Verify and prepare exact reviewed historical source
        if: ${{ matrix.flow != 'fulfillment_http' }}
        run: |
          case '${{ matrix.flow }}' in
            condition_http) revision=0157 ;;
            legacy_history) revision=0164 ;;
            *) exit 1 ;;
          esac
          python cloud_oam/scripts/prepare_condition_predecessor.py \
            --repository "$GITHUB_WORKSPACE" \
            --revision "$revision" \
            --destination "$GITHUB_WORKSPACE/cloud_oam/artifacts/condition-ci-predecessor-$revision"
          if [ "$revision" = 0164 ]; then
            python cloud_oam/scripts/prepare_condition_predecessor.py \
              --repository "$GITHUB_WORKSPACE" --revision 0164 --rollback-compatibility \
              --destination "$GITHUB_WORKSPACE/cloud_oam/artifacts/condition-ci-rollback-0164"
          fi

      - name: Run selected migration and business gate
        working-directory: cloud_oam
        run: |
          case '${{ matrix.flow }}' in
            condition_http)
              python scripts/run_local_pg16_return_condition_checks.py \
                --postgres-bin /usr/lib/postgresql/16/bin \
                --predecessor-source "$GITHUB_WORKSPACE/cloud_oam/artifacts/condition-ci-predecessor-0157/source/cloud_oam" \
                --formal-http --tracking ${{ matrix.tracking }} ;;
            legacy_history)
              python scripts/run_local_pg16_scrap_business_checks.py \
                --postgres-bin /usr/lib/postgresql/16/bin \
                --predecessor-source "$GITHUB_WORKSPACE/cloud_oam/artifacts/condition-ci-predecessor-0164/source/cloud_oam" \
                --rollback-source "$GITHUB_WORKSPACE/cloud_oam/artifacts/condition-ci-rollback-0164/source/cloud_oam" \
                --legacy-history-only --tracking ${{ matrix.tracking }} ;;
            fulfillment_http)
              python scripts/run_local_pg16_fulfillment_checks.py \
                --postgres-bin /usr/lib/postgresql/16/bin \
                --tracking ${{ matrix.tracking }} ;;
            *) exit 1 ;;
          esac

  static_safety:
    runs-on: ubuntu-24.04
    # A prior single-job complete run exceeded six hours before its last file.
    # Every matrix leg discovers disjoint files; aggregate requires all legs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Set up Node for mini-program API contract
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Install static gate command dependencies
        run: |
          python -m pip install --disable-pip-version-check -r cloud_oam/scripts/requirements-public-knowledge.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-client-16 zsh
          psql --version | grep -E ' 16[.]'
          zsh --version

      - name: Run complete backend and edge static safety gates
        working-directory: cloud_oam
        env:
          RSC_NATIVE_PG16_BIN: /usr/lib/postgresql/16/bin
        run: |
          python scripts/run_static_shard.py --index ${{ matrix.shard }} --count 3

  postgresql16-release-gate:
    if: ${{ always() }}
    needs: [pg16_runtime, pg16_loss, pg16_condition, static_safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all complete gates
        env:
          RUNTIME_RESULT: ${{ needs.pg16_runtime.result }}
          LOSS_RESULT: ${{ needs.pg16_loss.result }}
          CONDITION_RESULT: ${{ needs.pg16_condition.result }}
          STATIC_RESULT: ${{ needs.static_safety.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$LOSS_RESULT" = success
          test "$CONDITION_RESULT" = success
          test "$STATIC_RESULT" = success
