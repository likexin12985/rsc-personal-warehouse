name: PostgreSQL 16 release gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      # Tests also read deployment files, scripts and shared backend modules.
      # Cover the whole product tree so a new release input cannot bypass CI.
      - "cloud_oam/**"
  push:
    branches:
      - main
      - codex/production-readiness-gates
      - codex/notification-delivery-worker
    paths:
      - ".github/workflows/postgresql16-release-gate.yml"
      - "cloud_oam/**"

permissions:
  contents: read

concurrency:
  group: postgresql16-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg16_runtime:
    runs-on: ubuntu-24.04
    # Keep real migrations/concurrency separate from the independent static
    # suite. The aggregate below requires both jobs to succeed.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: rsc_pg16_release_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsc_pg16_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSC_PG16_GATE_ACKNOWLEDGE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_EPHEMERAL
      RSC_PG16_GATE_HOST: 127.0.0.1
      RSC_PG16_GATE_PORT: "5432"
      RSC_PG16_GATE_DATABASE: rsc_pg16_release_gate
      RSC_PG16_GATE_ADMIN_USER: postgres
      RSC_PG16_GATE_ADMIN_PASSWORD: pg16-admin-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_MIGRATOR_PASSWORD: pg16-migrator-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_API_PASSWORD: pg16-api-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_BACKUP_PASSWORD: pg16-backup-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_PROJECTOR_PASSWORD: pg16-projector-${{ github.run_id }}-${{ github.run_attempt }}
      RSC_PG16_GATE_EDGE_RECEIVER_PASSWORD: pg16-edge-receiver-${{ github.run_id }}-${{ github.run_attempt }}-disposable-release-gate
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Set up Node for mini-program API contract
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16 zsh
          psql --version | grep -E ' 16[.]'
          zsh --version

      - name: Run isolated PostgreSQL 16 migration and concurrency gate
        working-directory: cloud_oam/backend
        run: |
          python -m pytest -q tests/test_postgresql16_release_gate.py

  static_safety:
    runs-on: ubuntu-24.04
    # A prior single-job complete run exceeded six hours before its last file.
    # Every matrix leg discovers disjoint files; aggregate requires all legs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cloud_oam/backend/requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes \
            -r cloud_oam/backend/requirements-linux-amd64.lock
          python -m pip uninstall --yes setuptools wheel
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r cloud_oam/backend/requirements-ci-test.lock
          python -m pip check

      - name: Set up Node for mini-program API contract
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Install static gate command dependencies
        run: |
          python -m pip install --disable-pip-version-check -r cloud_oam/scripts/requirements-public-knowledge.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16 zsh
          psql --version | grep -E ' 16[.]'
          zsh --version

      - name: Run complete backend and edge static safety gates
        working-directory: cloud_oam
        run: |
          python scripts/run_static_shard.py --index ${{ matrix.shard }} --count 3

  postgresql16-release-gate:
    if: ${{ always() }}
    needs: [pg16_runtime, static_safety]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both complete gates
        env:
          RUNTIME_RESULT: ${{ needs.pg16_runtime.result }}
          STATIC_RESULT: ${{ needs.static_safety.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$STATIC_RESULT" = success
